<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamza Family Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Outfit:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1620;--bg2:#10222f;--ink:#f2ece0;--mute:#9fb0b8;--gold:#d4b06a;--line:rgba(242,236,224,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 16px/1.6 Outfit,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,5vw,64px)}
.logo{font:600 24px Cormorant Garamond,Georgia,serif;letter-spacing:.04em}
.logo i{color:var(--gold);font-style:normal}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.btn{background:var(--gold);color:#1a1408;padding:13px 28px;border-radius:999px;font-weight:500;transition:transform .2s}
.btn:hover{transform:scale(1.04)}
.ghost{border:1px solid var(--line);padding:9px 18px;border-radius:999px;color:var(--mute);font-size:14px}
.ghost:hover{color:var(--ink);border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hero{position:relative;padding:clamp(40px,9vw,120px) clamp(18px,5vw,64px) 70px;min-height:62vh;display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(900px 500px at 78% 20%,rgba(212,176,106,.22),transparent 60%),linear-gradient(180deg,#12303f 0%,var(--bg) 100%)}
.hero h1{font:600 clamp(44px,9vw,116px)/.95 Cormorant Garamond,Georgia,serif;max-width:12ch;letter-spacing:-.01em;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.hero p{max-width:46ch;color:var(--mute);margin:20px 0 30px;font-size:18px}
.meta{color:var(--gold);font-size:14px;margin-bottom:14px}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
section{padding:10px clamp(18px,5vw,64px) 40px}
h2{font:600 30px Cormorant Garamond,Georgia,serif;margin:30px 0 16px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.card{text-align:left;display:block;width:100%}
.poster{aspect-ratio:2/3;border-radius:10px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;border:1px solid var(--line);transition:transform .3s,border-color .3s}
.poster b{font:600 26px/1.05 Cormorant Garamond,Georgia,serif;position:relative}
.poster span{font-size:13px;color:rgba(242,236,224,.75);position:relative}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,10,14,.75))}
.card:hover .poster{transform:translateY(-6px);border-color:var(--gold)}
.play{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(10,22,32,.6);display:grid;place-items:center;z-index:1;font-size:13px;padding-left:2px}
.empty{color:var(--mute);padding:30px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:8px 18px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:14px}
.tabs button.on{background:var(--ink);color:#10222f;border-color:var(--ink)}
dialog{border:0;background:#05090d;color:var(--ink);width:min(1100px,96vw);max-height:94vh;border-radius:14px;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(3,6,9,.88)}
.frame{aspect-ratio:16/9;width:100%;background:#000}
.frame iframe{width:100%;height:100%;border:0}
.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;gap:12px}
.bar h3{font:600 26px Cormorant Garamond,serif}
form.add{display:grid;gap:12px;padding:26px;background:var(--bg2)}
form.add h3{font:600 28px Cormorant Garamond,serif}
input,select{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:8px;font:inherit;width:100%}
footer{color:var(--mute);font-size:13px;padding:30px clamp(18px,5vw,64px) 50px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.adm{width:min(900px,96vw)}
.adm .body{padding:24px;background:var(--bg2);max-height:78vh;overflow:auto;display:grid;gap:14px}
.adm h3{font:600 28px Cormorant Garamond,serif}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px}
.row .full{grid-column:1/-1}
.row .acts{display:flex;gap:8px;grid-column:1/-1;justify-content:flex-end}
.msg{color:var(--gold);font-size:14px;min-height:20px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">Hamza <i>Family</i> Cinema</div>
</header>

<div class="hero">
  <div class="meta" id="heroMeta"></div>
  <h1 id="heroTitle">Our stories, on the big screen.</h1>
  <p id="heroNote">Family films and memories, streaming from one private library. Press play and settle in.</p>
  <div><button class="btn" id="heroPlay">Play now</button></div>
</div>

<section>
  <div class="tabs" id="tabs"></div>
  <h2 id="shelfTitle">Library</h2>
  <div class="rail" id="rail"></div>
</section>

<footer>Streams directly from Google Drive. No downloads, no sign-up. Best on Wi-Fi.</footer>

<dialog id="player">
  <div class="frame" id="frame"></div>
  <div class="bar"><h3 id="pTitle"></h3><span style="display:flex;gap:10px;align-items:center"><a id="pLink" class="ghost" style="text-decoration:none" href="#" target="_blank" rel="noopener noreferrer">Not playing? Open in Drive</a><button class="ghost" id="closeBtn">Close</button></span></div>
</dialog>


<script src="library.js"></script>
<script>
const $=id=>document.getElementById(id);
const lib=(window.LIBRARY||[]).filter(x=>x&&x.id);
const HUES=[[196,40],[28,45],[340,30],[160,35],[260,30],[48,45]];
let cat="All";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const art=i=>{const [h,s]=HUES[i%HUES.length];return `linear-gradient(160deg,hsl(${h} ${s}% 34%),hsl(${(h+40)%360} ${s}% 14%))`};
const getId=v=>{const m=String(v).match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?(m[1]||m[2]):String(v).trim()};

function render(){
  const items=lib,cats=["All",...new Set(items.map(x=>x.cat))];
  if(!cats.includes(cat))cat="All";
  $("tabs").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const list=items.map((x,i)=>({...x,i})).filter(x=>cat==="All"||x.cat===cat);
  $("shelfTitle").textContent=cat==="All"?"Library":cat;
  $("rail").innerHTML=list.length?list.map(x=>`<button class="card" data-i="${x.i}"><div class="poster" style="background:${art(x.i)}"><div class="play">▶</div><b>${esc(x.title)}</b><span>${esc(x.year)} ${esc(x.cat)}</span></div></button>`).join(""):`<p class="empty">Nothing here yet. Check back soon.</p>`;
  const f=items[0];
  if(f){$("heroMeta").textContent=`Featured: ${f.cat}${f.year?" · "+f.year:""}`;$("heroTitle").textContent=f.title;if(f.note)$("heroNote").textContent=f.note}
}
function play(i){
  const x=lib[i];if(!x)return;
  const id=encodeURIComponent(x.id);
  $("pTitle").textContent=x.title;
  $("pLink").href="https://drive.google.com/file/d/"+id+"/view";
  $("frame").innerHTML='<iframe src="https://drive.google.com/file/d/'+id+'/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>';
  $("player").showModal();
}
$("rail").onclick=e=>{const c=e.target.closest(".card");if(c)play(+c.dataset.i)};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
$("heroPlay").onclick=()=>play(0);
$("closeBtn").onclick=()=>$("player").close();
$("player").addEventListener("close",()=>{$("frame").innerHTML=""});


render();
</script></body></html>
